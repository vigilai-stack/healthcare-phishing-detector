[project]
name = "phishguard"
version = "1.0.0"
description = "Local healthcare-themed phishing screen. CPU only, no paid APIs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sangeeta Sinha", email = "sangeeta@vigilaisolutions.com" }]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "joblib>=1.3",
  "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
phishguard = "phishguard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishguard = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
